name: Deploy API reference (manual)

# Builds the TypeDoc site from any ref and deploys it to sdk.d-id.com on demand.
# The prod release (publish-on-merge.yml) still deploys automatically after each npm publish;
# use this to verify the site from main, or to redeploy without a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build the reference from'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # No dependency cache: the ref is user-chosen, and a cache written here would be shared with
      # every workflow run on the default branch (CodeQL: cache poisoning).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build API reference
        run: yarn docs:build --gitRevision "$(git rev-parse HEAD)"

      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    name: Deploy API reference to sdk.d-id.com
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
