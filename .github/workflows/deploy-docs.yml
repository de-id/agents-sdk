name: Deploy API reference (manual)

# Builds the TypeDoc site from the branch the run is dispatched on and deploys it to
# sdk.d-id.com on demand: `gh workflow run deploy-docs.yml --ref main`.
# The prod release (publish-on-merge.yml) still deploys automatically after each npm publish;
# use this to verify the site from main, or to redeploy without a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No dependency cache: keep this job free of cache writes that other workflows would restore.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build API reference
        run: yarn docs:build --gitRevision "$(git rev-parse HEAD)"

      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    name: Deploy API reference to sdk.d-id.com
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
